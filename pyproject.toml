[project]
name = "forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dimensionsurfer1", email = "saxenaaryan2452005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "langgraph>=1.2.20",
    "litellm>=1.108.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
forge = "forge:main"
forge-dashboard = "forge.dashboard.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
